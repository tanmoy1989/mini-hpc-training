# Mini-HPC Training Cluster
# Slurm 23.11.4

ClusterName=mini-hpc
SlurmctldHost=node01

# Authentication
AuthType=auth/munge
SlurmUser=slurm
SlurmdUser=root

# Controller and compute node state
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

# Process tracking
ProctrackType=proctrack/linuxproc
ReturnToService=2

# Nodes
NodeName=node01 CPUs=1 RealMemory=1800 State=UNKNOWN
NodeName=node02 CPUs=1 RealMemory=1800 State=UNKNOWN

# Partition
PartitionName=compute Nodes=node01,node02 Default=YES MaxTime=INFINITE State=UP
